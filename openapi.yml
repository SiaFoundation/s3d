openapi: "3.0.0"
info:
  title: s3d Admin API
  description: >
    s3d serves an admin API on a separate HTTP address for monitoring the background upload pipeline. It is always enabled and defaults to 127.0.0.1:8001. Requests are authenticated via HTTP Basic authentication using the configured admin password; the username is ignored.

  version: 0.2.1
servers:
  - url: http://127.0.0.1:8001
security:
  - basicAuth: []
tags:
  - name: metrics
    description: Background upload pipeline statistics for monitoring.
  - name: uploads
    description: Background upload pipeline control.
  - name: repack
    description: Slab waste analysis and repacking.
  - name: system
    description: System administration endpoints.
paths:
  /prometheus:
    get:
      tags:
        - metrics
      summary: Get upload metrics in Prometheus exposition format
      description: >
        Returns metrics about the background upload pipeline in the Prometheus text exposition format. Pipeline and local buffer state is exposed under the s3d_upload_ prefix, transfer activity under s3d_transfer_. Rates are not exposed as series. Derive them from the byte totals, and read the progress of each upload from /stats/uploads.

      operationId: getPrometheus
      responses:
        "200":
          description: Metrics in Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
  /stats/uploads:
    get:
      tags:
        - metrics
      summary: Get upload pipeline stats as JSON
      description: >
        Returns the upload pipeline stats in JSON, including the live transfer rates and the progress of each upload in flight. Used by `s3d status` for a basic overview without requiring a Prometheus stack.

      operationId: getUploadStats
      responses:
        "200":
          description: Current upload pipeline stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStats"
  /repack:
    get:
      tags:
        - repack
      summary: Open the slab repacker admin page
      responses:
        "200":
          description: HTML slab repacker interface.
          content:
            text/html:
              schema:
                type: string
  /repack/preview:
    get:
      tags:
        - repack
      summary: Preview slab waste and a repack plan
      parameters:
        - in: query
          name: maxSlabFillPercent
          schema:
            type: number
            format: double
            default: 10
        - in: query
          name: maxObjectSize
          schema:
            type: integer
            format: int64
            default: 10485760
          description: Maximum full logical object size to rewrite, in bytes.
        - in: query
          name: reuploadBudget
          schema:
            type: integer
            format: int64
            default: 1073741824
          description: Maximum total full-object bytes to rewrite, in bytes.
      responses:
        "200":
          description: Current waste statistics and the selected repack plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepackPreview"
        "400":
          description: Invalid preview options.
  /repack/status:
    get:
      tags:
        - repack
      summary: Get slab repack job status
      responses:
        "200":
          description: Current or most recent repack job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepackStatus"
  /repack/start:
    post:
      tags:
        - repack
      summary: Start a background slab repack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepackOptions"
      responses:
        "200":
          description: Repack job started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepackStatus"
        "400":
          description: Invalid options or no slabs matched.
        "409":
          description: A repack job is already running.
  /repack/cancel:
    post:
      tags:
        - repack
      summary: Cancel the active slab repack
      responses:
        "200":
          description: Current repack status after requesting cancellation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepackStatus"
  /objects/flush:
    post:
      tags:
        - uploads
      summary: Flush pending objects to Sia
      description: >
        Uploads all pending objects to Sia immediately, regardless of padding, and pins them so their local pending files are removed. Blocks until done.

      operationId: flushObjects
      responses:
        "200":
          description: All pending objects were flushed to Sia.
        "500":
          description: Internal error while pinning, or the request was cancelled.
  /snapshots:
    post:
      tags:
        - system
      summary: Upload a database snapshot to Sia
      description: >
        Flushes any pending objects to the Sia network, then backs up the SQLite metadata database and uploads it as a tagged, pinned object so it can be recovered later. The request blocks while pending objects upload. Objects that a snapshot references are not unpinned until the snapshot is deleted. The backup does not block database reads or writes.

      operationId: createSnapshot
      responses:
        "200":
          description: The snapshot was created and uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "500":
          description: The snapshot could not be created.
    get:
      tags:
        - system
      summary: List database snapshots
      description: >
        Lists the recorded database snapshots, newest first, along with whether the instance has finished syncing with the Sia network. Until it has, the list may be incomplete. A snapshot prevents the objects it references from being unpinned from the Sia network until the snapshot is deleted.

      operationId: listSnapshots
      responses:
        "200":
          description: The recorded snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotList"
        "500":
          description: The snapshots could not be listed.
  /snapshots/{objectID}:
    delete:
      tags:
        - system
      summary: Delete a database snapshot
      description: >
        Unpins the snapshot's Sia object from the network and removes its record, so the objects it was withholding can be unpinned. Snapshots are addressed by their Sia object ID.

      operationId: deleteSnapshot
      parameters:
        - name: objectID
          in: path
          required: true
          description: The Sia object ID of the snapshot to delete.
          schema:
            type: string
      responses:
        "200":
          description: The snapshot was deleted.
        "400":
          description: The Sia object ID could not be parsed.
        "404":
          description: No snapshot with that Sia object ID exists.
        "500":
          description: The snapshot could not be deleted.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    UploadStats:
      type: object
      description: Statistics about the background upload pipeline.
      properties:
        pendingObjects:
          type: integer
          format: int64
          description: Objects buffered on disk waiting to be uploaded to Sia.
        pendingSize:
          type: integer
          format: int64
          description: Total size of pending objects in bytes.
        uploadedObjects:
          type: integer
          format: int64
          description: Objects fully uploaded to the Sia network.
        uploadedSize:
          type: integer
          format: int64
          description: Total size of uploaded objects in bytes.
        unpinnedObjects:
          type: integer
          format: int64
          description: Objects uploaded to Sia but not yet pinned in the indexer.
        failedUploads:
          type: integer
          format: int64
          description: Failed upload attempts since the process started.
        orphanedObjects:
          type: integer
          format: int64
          description: Deleted or overwritten objects pending cleanup.
        multipartUploads:
          type: integer
          format: int64
          description: In-progress multipart uploads.
        bufferUsed:
          type: integer
          format: int64
          description: Bytes held on disk in the uploads directory, covering objects awaiting upload, objects uploaded but not yet pinned, and the parts of multipart uploads still in progress. Objects sharing a file are counted once.
        bufferLimit:
          type: integer
          format: int64
          description: Configured disk buffer limit in bytes. Zero means unlimited.
        transfer:
          $ref: "#/components/schemas/TransferStats"
    TransferStats:
      type: object
      description: Live transfer activity. Byte totals cover the current process and rates cover a five second window.
      properties:
        ingressActive:
          type: integer
          format: int64
          description: PutObject and UploadPart requests currently in flight.
        ingressBytes:
          type: integer
          format: int64
          description: Object bytes read from S3 request bodies since the process started.
        ingressRate:
          type: integer
          format: int64
          description: Object bytes per second read from S3 request bodies.
        uploadBytes:
          type: integer
          format: int64
          description: Bytes written to Sia hosts since the process started. A retried upload is counted again.
        uploadRate:
          type: integer
          format: int64
          description: Bytes per second written to Sia hosts.
        activeUploads:
          type: array
          description: Upload groups currently streaming to Sia, in the order they started. Omitted when none are in flight.
          items:
            $ref: "#/components/schemas/ActiveUpload"
    ActiveUpload:
      type: object
      description: An upload group being streamed from the local buffer to Sia.
      properties:
        label:
          type: string
          description: The bucket and key as bucket/key when the group holds a single object, otherwise the number of objects it holds.
        objects:
          type: integer
          format: int64
          description: Objects packed into the group.
        size:
          type: integer
          format: int64
          description: Total size of the group in bytes.
        sent:
          type: integer
          format: int64
          description: Bytes of the group handed to the Sia uploader. Some may still be buffered in memory rather than stored on hosts.
        finalizing:
          type: boolean
          description: Whether every object has been handed over and the group is being finalized on the Sia network.
    RepackOptions:
      type: object
      description: Limits used to select sparse slabs for repacking.
      properties:
        maxSlabFillPercent:
          type: number
          format: double
          default: 10
          description: Select slabs whose live occupancy is below this percentage.
        maxObjectSize:
          type: integer
          format: int64
          default: 10485760
          description: Maximum full logical size of an object that may be rewritten.
        reuploadBudget:
          type: integer
          format: int64
          default: 1073741824
          description: Maximum total full-object bytes selected for one repack job.
    RepackPreview:
      type: object
      properties:
        options:
          $ref: "#/components/schemas/RepackOptions"
        slabs:
          type: integer
        logicalCapacity:
          type: integer
          format: int64
        liveBytes:
          type: integer
          format: int64
        logicalWaste:
          type: integer
          format: int64
        wastePercent:
          type: number
          format: double
        physicalCapacity:
          type: integer
          format: int64
        physicalWaste:
          type: integer
          format: int64
        candidateSlabs:
          type: integer
        selectedSlabs:
          type: integer
        objectsToRewrite:
          type: integer
        rewriteBytes:
          type: integer
          format: int64
        estimatedLogicalReclaim:
          type: integer
          format: int64
        estimatedPhysicalReclaim:
          type: integer
          format: int64
        busySlabs:
          type: integer
        skippedLargeSlabs:
          type: integer
        skippedBudgetSlabs:
          type: integer
    RepackStatus:
      type: object
      properties:
        state:
          type: string
          enum: [idle, running, completed, failed, canceled]
        phase:
          type: string
          description: Current repack phase, such as rewriting, finalizing, pinning, committing, or cleanup.
        options:
          $ref: "#/components/schemas/RepackOptions"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        objectsTotal:
          type: integer
        objectsCompleted:
          type: integer
        currentObject:
          type: string
          description: Representative bucket/key for the Sia object currently being processed.
        currentObjectID:
          type: string
          description: Sia object ID currently being processed.
        currentObjectIndex:
          type: integer
        currentObjectSize:
          type: integer
          format: int64
        rewriteBytes:
          type: integer
          format: int64
        rewrittenBytes:
          type: integer
          format: int64
        estimatedLogicalReclaim:
          type: integer
          format: int64
        estimatedPhysicalReclaim:
          type: integer
          format: int64
        error:
          type: string
    Snapshot:
      type: object
      description: A database snapshot uploaded to Sia.
      properties:
        createdAt:
          type: string
          format: date-time
          description: Time the snapshot was recorded.
        siaObjectID:
          type: string
          description: ID of the Sia object holding the snapshot.
        objectCount:
          type: integer
          format: int64
          description: Number of uploaded objects captured by the snapshot.
    SnapshotList:
      type: object
      description: The recorded database snapshots and the instance's sync state.
      properties:
        synced:
          type: boolean
          description: Whether the last metadata sync reached the end of the account's event stream.
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/Snapshot"
