openapi: "3.0.0"
info:
  title: s3d Admin API
  description: >
    s3d serves an admin API on a separate HTTP address for monitoring the background upload pipeline. It is always enabled and defaults to 127.0.0.1:8001. Requests are authenticated via HTTP Basic authentication using the configured admin password; the username is ignored.

  version: 0.1.4
servers:
  - url: http://127.0.0.1:8001
security:
  - basicAuth: []
tags:
  - name: metrics
    description: Background upload pipeline statistics for monitoring.
  - name: uploads
    description: Background upload pipeline control.
  - name: system
    description: System administration endpoints.
paths:
  /prometheus:
    get:
      tags:
        - metrics
      summary: Get upload metrics in Prometheus exposition format
      description: >
        Returns metrics about the background upload pipeline in the Prometheus text exposition format. Pipeline and local buffer state is exposed under the s3d_upload_ prefix, transfer activity under s3d_transfer_. Rates are not exposed as series. Derive them from the byte totals, and read the progress of each upload from /stats/uploads.

      operationId: getPrometheus
      responses:
        "200":
          description: Metrics in Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
  /stats/uploads:
    get:
      tags:
        - metrics
      summary: Get upload pipeline stats as JSON
      description: >
        Returns the upload pipeline stats in JSON, including the live transfer rates and the progress of each upload in flight. Used by `s3d status` for a basic overview without requiring a Prometheus stack.

      operationId: getUploadStats
      responses:
        "200":
          description: Current upload pipeline stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStats"
  /objects/flush:
    post:
      tags:
        - uploads
      summary: Flush pending objects to Sia
      description: >
        Uploads all pending objects to Sia immediately, regardless of padding, and pins them so their local pending files are removed. Blocks until done.

      operationId: flushObjects
      responses:
        "200":
          description: All pending objects were flushed to Sia.
        "500":
          description: Internal error while pinning, or the request was cancelled.
  /system/sqlite3/backup:
    post:
      tags:
        - system
      summary: Back up the SQLite3 metadata database
      description: >
        Creates a backup of the SQLite metadata database using the SQLite online backup API. Unlike copying the database file directly, the backup is a consistent snapshot even while objects are being written. The backup only contains the metadata database, not the buffered objects that have not yet been uploaded to the Sia network.

      operationId: backupSQLite3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupSQLite3Request"
      responses:
        "200":
          description: The backup was created successfully.
        "400":
          description: >
            The request was invalid, e.g. the path was empty or not absolute.

        "500":
          description: The backup could not be created.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    UploadStats:
      type: object
      description: Statistics about the background upload pipeline.
      properties:
        pendingObjects:
          type: integer
          format: int64
          description: Objects buffered on disk waiting to be uploaded to Sia.
        pendingSize:
          type: integer
          format: int64
          description: Total size of pending objects in bytes.
        uploadedObjects:
          type: integer
          format: int64
          description: Objects fully uploaded to the Sia network.
        uploadedSize:
          type: integer
          format: int64
          description: Total size of uploaded objects in bytes.
        unpinnedObjects:
          type: integer
          format: int64
          description: Objects uploaded to Sia but not yet pinned in the indexer.
        failedUploads:
          type: integer
          format: int64
          description: Failed upload attempts since the process started.
        orphanedObjects:
          type: integer
          format: int64
          description: Deleted or overwritten objects pending cleanup.
        multipartUploads:
          type: integer
          format: int64
          description: In-progress multipart uploads.
        transfer:
          $ref: "#/components/schemas/TransferStats"
    TransferStats:
      type: object
      description: Live transfer activity. Byte totals cover the current process and rates cover the last few seconds.
      properties:
        ingressActive:
          type: integer
          format: int64
          description: Request bodies currently being read from S3 clients.
        ingressBytes:
          type: integer
          format: int64
          description: Object bytes read from S3 request bodies since the process started.
        ingressRate:
          type: integer
          format: int64
          description: Object bytes per second read from S3 request bodies.
        uploadActive:
          type: integer
          format: int64
          description: Upload groups currently streaming to Sia.
        uploadBytes:
          type: integer
          format: int64
          description: Bytes handed to the Sia uploader since the process started. A retried upload is counted again.
        uploadRate:
          type: integer
          format: int64
          description: Bytes per second handed to the Sia uploader.
        bufferUsed:
          type: integer
          format: int64
          description: Bytes buffered on disk pending upload to Sia.
        bufferLimit:
          type: integer
          format: int64
          description: Configured disk buffer limit in bytes. Zero means unlimited.
        activeUploads:
          type: array
          description: Upload groups currently streaming to Sia, in the order they started. Omitted when none are in flight.
          items:
            $ref: "#/components/schemas/ActiveUpload"
    ActiveUpload:
      type: object
      description: An upload group being streamed from the local buffer to Sia.
      properties:
        label:
          type: string
          description: The object key when the group holds a single object, otherwise the number of objects it holds.
        objects:
          type: integer
          description: Objects packed into the group.
        size:
          type: integer
          format: int64
          description: Total size of the group in bytes.
        sent:
          type: integer
          format: int64
          description: Bytes of the group handed to the Sia uploader. Some may still be buffered in memory rather than stored on hosts.
        finalizing:
          type: boolean
          description: Whether every object has been handed over and the group is being finalized on the Sia network.
    BackupSQLite3Request:
      type: object
      description: Request body for creating a SQLite3 database backup.
      required:
        - path
      properties:
        path:
          type: string
          description: >
            Absolute filesystem path, resolved on the machine running s3d, where the backup file will be written. It must not already exist.

          example: /backups/s3d.sqlite3
