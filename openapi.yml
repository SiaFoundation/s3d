openapi: "3.0.0"
info:
  title: s3d Admin API
  description: >
    s3d serves an admin API on a separate HTTP address for monitoring the
    background upload pipeline. It is always enabled and defaults to
    127.0.0.1:8001. Requests are authenticated via HTTP Basic authentication
    using the configured admin password; the username is ignored.
  version: 0.1.1

servers:
  - url: http://127.0.0.1:8001

security:
  - basicAuth: []

tags:
  - name: metrics
    description: Background upload pipeline statistics for monitoring.
  - name: uploads
    description: Background upload pipeline control.
  - name: system
    description: System administration endpoints.

paths:
  /prometheus:
    get:
      tags:
        - metrics
      summary: Get upload metrics in Prometheus exposition format
      description: >
        Returns metrics about the background upload pipeline in the Prometheus
        text-based exposition format. The exposed series are
        s3d_upload_pending_objects, s3d_upload_pending_size_bytes,
        s3d_upload_uploaded_objects, s3d_upload_uploaded_size_bytes,
        s3d_upload_failed_uploads, s3d_upload_orphaned_objects, and
        s3d_upload_multipart_uploads.
      operationId: getPrometheus
      responses:
        "200":
          description: Metrics in Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
  /stats/uploads:
    get:
      tags:
        - metrics
      summary: Get upload pipeline stats as JSON
      description: >
        Returns the same upload pipeline stats as the Prometheus endpoint, but
        in JSON. Used by `s3d status` for a basic overview without requiring a
        Prometheus stack.
      operationId: getUploadStats
      responses:
        "200":
          description: Current upload pipeline stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStats"
  /objects/flush:
    post:
      tags:
        - uploads
      summary: Flush pending objects to Sia
      description: >
        Uploads all pending objects to Sia immediately, regardless of padding,
        and pins them so their local pending files are removed. Blocks until done.
      operationId: flushObjects
      responses:
        "200":
          description: All pending objects were flushed to Sia.
        "500":
          description: Internal error while pinning, or the request was cancelled.
  /snapshots:
    post:
      tags:
        - system
      summary: Upload a database snapshot to Sia
      description: >
        Flushes any pending objects to the Sia network, then backs up the
        SQLite metadata database and uploads it to the Sia network as a
        tagged, pinned object so it can be recovered later. The request may
        block while pending objects upload, and the resulting snapshot
        references every object flushed before the snapshot was taken.
        Objects that a snapshot references are not unpinned until the
        snapshot is deleted. The backup does not block database reads or
        writes.
      operationId: createSnapshot
      responses:
        "200":
          description: The snapshot was created and uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "500":
          description: The snapshot could not be created.
    get:
      tags:
        - system
      summary: List database snapshots
      description: >
        Lists the recorded database snapshots. A snapshot prevents the
        objects it references from being unpinned from the Sia network until
        the snapshot is deleted.
      operationId: listSnapshots
      responses:
        "200":
          description: The recorded snapshots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snapshot"
        "500":
          description: The snapshots could not be listed.
  /snapshots/{objectID}:
    delete:
      tags:
        - system
      summary: Delete a database snapshot
      description: >
        Unpins the snapshot's Sia object from the network and removes its
        record, releasing the orphaned objects it was withholding. Snapshots are
        addressed by their Sia object ID.
      operationId: deleteSnapshot
      parameters:
        - name: objectID
          in: path
          required: true
          description: >
            The Sia object ID of the snapshot to delete. This is the only
            identifier that survives losing the database, so it is how snapshots
            are addressed.
          schema:
            type: string
      responses:
        "200":
          description: The snapshot was deleted.
        "400":
          description: The Sia object ID could not be parsed.
        "404":
          description: No snapshot with that Sia object ID exists.
        "500":
          description: The snapshot could not be deleted.

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    UploadStats:
      type: object
      description: Statistics about the background upload pipeline.
      properties:
        pendingObjects:
          type: integer
          format: int64
          description: Objects buffered on disk waiting to be uploaded to Sia.
        pendingSize:
          type: integer
          format: int64
          description: Total size of pending objects in bytes.
        uploadedObjects:
          type: integer
          format: int64
          description: Objects fully uploaded to the Sia network.
        uploadedSize:
          type: integer
          format: int64
          description: Total size of uploaded objects in bytes.
        failedUploads:
          type: integer
          format: int64
          description: Failed upload attempts since the process started.
        orphanedObjects:
          type: integer
          format: int64
          description: Deleted or overwritten objects pending cleanup.
        multipartUploads:
          type: integer
          format: int64
          description: In-progress multipart uploads.
    Snapshot:
      type: object
      description: A database snapshot uploaded to Sia.
      properties:
        createdAt:
          type: string
          format: date-time
          description: Time the snapshot was recorded.
        siaObjectID:
          type: string
          description: ID of the Sia object holding the snapshot.
        objectCount:
          type: integer
          format: int64
          description: Number of uploaded objects captured by the snapshot.
