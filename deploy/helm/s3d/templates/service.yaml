apiVersion: v1
kind: Service
metadata:
  name: {{ include "s3d.fullname" . }}
  labels:
    {{- include "s3d.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 8000
      targetPort: s3
    - name: admin
      port: 8001
      targetPort: admin
  selector:
    {{- include "s3d.selectorLabels" . | nindent 4 }}
