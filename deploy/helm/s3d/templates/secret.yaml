{{- $config := dict "log" (dict "file" (dict "enabled" false) "stdout" (dict "enableANSI" false)) }}
{{- $config = mergeOverwrite $config (deepCopy .Values.config) (dict
  "apiAddress" ":8000"
  "adminAddress" ":8001"
  "adminPassword" (required "adminPassword is required" .Values.adminPassword)
  "directory" "/data") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3d.fullname" . }}
  labels:
    {{- include "s3d.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3d.yml: |
    {{- toYaml $config | nindent 4 }}
  indexerURL: {{ .Values.indexerURL | quote }}
  recoveryPhrase: {{ .Values.recoveryPhrase | quote }}
  preauthorizedKey: {{ .Values.preauthorizedKey | quote }}
